name: Feature request
description: Suggest a capability, tool, or documentation improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. The project is early-stage, so please describe the use case before proposing an implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow that is difficult or impossible today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the server or documentation to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you thought about.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP tool / server
        - Medium API integration
        - Client setup guide
        - Documentation
        - Packaging or deployment
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
